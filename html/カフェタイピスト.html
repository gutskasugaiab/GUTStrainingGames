<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カフェ・タイピスト</title>
    <style>
        /* ===== CSS変数 ===== */
        :root {
            --brown-dark: #3e2723;
            --brown-mid: #5d4037;
            --brown-light: #8d6e63;
            --cream: #efebe9;
            --bg-panel: rgba(255, 255, 255, 0.88);
            --accent: #d84315;
            --correct: #a1887f;
            --next: #ff5722;
            --untyped: #5d4037;
            --green: #2e7d32;
        }

        /* ===== リセット・基本 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background-color: #d7ccc8;
            background-image: url('../img/4/bg_cafe.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--brown-dark);
            height: 100vh;
            overflow: hidden;
        }

        /* ===== タイトル画面 ===== */
        #title-screen {
            position: fixed;
            inset: 0;
            background: rgba(62, 39, 35, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            transition: opacity 0.5s ease;
        }

        .title-inner {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .title-inner img.staff-img {
            height: 280px;
        }

        .title-text-block {
            text-align: center;
        }

        .title-text-block img.logo-img {
            width: 500px;
            max-width: 90vw;
            height: auto;
            animation: float 3s ease-in-out infinite;
        }

        .title-text-block h1 {
            font-family: Georgia, serif;
            letter-spacing: 4px;
            margin: 8px 0 20px;
            font-size: 1.4em;
            opacity: 0.85;
        }

        #start-button {
            padding: 16px 48px;
            font-size: 28px;
            background: var(--brown-light);
            color: white;
            border: 2px solid white;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        #start-button:hover {
            background: #a1887f;
        }

        #start-button:active {
            transform: scale(0.97);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-14px);
            }
        }

        /* ===== ゲーム本体 ===== */
        #game-main {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        /* ヘッダー */
        header {
            text-align: center;
            background: rgba(93, 64, 55, 0.92);
            padding: 10px 0;
            color: white;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            font-weight: bold;
            font-size: 1.05em;
        }

        /* ゲームコンテナ */
        #game-container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .game-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border-radius: 20px;
            background: var(--bg-panel);
        }

        /* アバターエリア */
        .avatar-area {
            height: 40vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 16px;
            border-bottom: 1px dashed #ccc;
        }

        .avatar-area img {
            height: 90%;
            max-width: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1.1s ease;
        }

        /* ターゲットエリア */
        #target-area {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 0.08em;
            background: white;
            padding: 18px 24px;
            border-radius: 10px;
            margin-bottom: 14px;
            min-height: 1.5em;
            text-align: center;
            width: 100%;
            /* ★ シェイクアニメーション */
            transition: border-color 0.2s;
        }

        #target-area.shake {
            animation: shake 0.22s ease-in-out;
        }

        /* 文字カラークラス */
        .char-correct {
            color: var(--correct);
            opacity: 0.6;
        }

        .char-next {
            color: var(--next);
            font-weight: bold;
            border-bottom: 3px solid var(--next);
            background: rgba(255, 87, 34, 0.1);
        }

        .char-untyped {
            color: var(--untyped);
        }

        /* 入力ボックス */
        #typing-box {
            font-size: 28px;
            font-weight: bold;
            color: var(--green);
            padding: 12px;
            width: 85%;
            border: 3px solid #ccc;
            border-radius: 10px;
            outline: none;
            text-align: center;
            background: #f5f5f5;
            caret-color: var(--next);
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        #typing-box:focus {
            background: white;
            border-color: #ff9800;
            box-shadow: 0 0 16px rgba(255, 152, 0, 0.45);
            animation: pulse 1.5s infinite;
        }

        #typing-box:disabled {
            background: #e0e0e0;
            border-color: #bdbdbd;
            box-shadow: none;
            cursor: not-allowed;
        }

        #typing-box:-webkit-autofill {
            -webkit-text-fill-color: var(--green);
            box-shadow: 0 0 0 1000px white inset;
        }

        .hint-text {
            font-size: 0.78em;
            margin-top: 8px;
            color: #795548;
        }

        /* お客様の吹き出し */
        #customer-speech {
            font-size: 1.2em;
            color: var(--accent);
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            text-align: center;
            min-height: 3.2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== 日別リザルト ===== */
        #result-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            text-align: center;
        }

        .result-content {
            background: var(--brown-mid);
            padding: 40px 50px;
            border-radius: 20px;
            border: 2px solid white;
            min-width: 320px;
        }

        .result-content h2 {
            margin-bottom: 16px;
            font-size: 1.8em;
        }

        .result-content p {
            margin: 8px 0;
            font-size: 1.1em;
        }

        #rank-block {
            margin: 20px 0;
            display: none;
        }

        #rank-block img {
            max-width: 180px;
            border-radius: 10px;
            border: 3px solid white;
        }

        #rank-text {
            font-weight: bold;
            font-size: 1.4em;
            margin-top: 10px;
        }

        #next-btn {
            margin-top: 24px;
            padding: 14px 40px;
            font-size: 22px;
            background: var(--brown-light);
            color: white;
            border: 2px solid white;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #next-btn:hover {
            background: #a1887f;
        }

        /* ===== アニメーション ===== */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 6px rgba(255, 152, 0, 0.4);
            }

            50% {
                box-shadow: 0 0 20px rgba(255, 152, 0, 0.8);
            }
        }
    </style>
</head>

        // =============================================

            uiDay.innerText = state.day + 1;
            uiCust.innerText = state.cust + 1;
            uiMiss.innerText = state.misses;
        }

        /** 文字単位でハイライト描画 */
        function renderTarget(target, correctCount) {
            let html = '';
            for (let i = 0; i < target.length; i++) {
                const ch = target[i];
                if (i < correctCount) {
                    html += `<span class="char-correct">${ch}</span>`;
                } else if (i === correctCount) {
                    html += `<span class="char-next">${ch}</span>`;
                } else {
                    html += `<span class="char-untyped">${ch}</span>`;
                }
            }
            targetArea.innerHTML = html;
        }

        function triggerShake() {
            targetArea.classList.remove('shake');
            void targetArea.offsetWidth; // reflow でアニメーションリセット
            targetArea.classList.add('shake');
            targetArea.addEventListener('animationend', () => targetArea.classList.remove('shake'), { once: true });
        }

        // =============================================
        //  お客様のセリフを1文字ずつ表示
        // =============================================
        function customerSpeak(text, callback) {
            clearInterval(state.speechTimer);
            inputElem.disabled = true;
            speechElem.innerText = '';
            let i = 0;
            state.speechTimer = setInterval(() => {
                speechElem.innerText += text[i++];
                if (i >= text.length) {
                    clearInterval(state.speechTimer);
                    if (callback) callback();
                }
            }, 40);
        }

                        renderTarget(currentTarget(), 0);
                    });
                }, 800);
            }, 100);
        }

        // =============================================
        //  入力を有効化してフォーカス
        // =============================================
        function activateInput() {
            state.typed = 0;
            inputElem.disabled = false;
            inputElem.value = GUARD;
            inputElem.focus();
            setTimeout(() => {
                inputElem.focus();
                inputElem.setSelectionRange(GUARD.length, GUARD.length);
            }, 20);
        }

        // =============================================
        //  入力チェック（メイン）
        // =============================================
        const GUARD = '　'; // 全角スペースのガード文字

        /** 半角英数字・記号を全角に正規化する */
        function toFullWidth(str) {
            return str.replace(/[\x21-\x7E]/g, ch =>
                String.fromCharCode(ch.charCodeAt(0) + 0xFEE0)
            );
        }

        function checkInput() {
            // ガード文字が消えた場合は復元
            if (!inputElem.value.startsWith(GUARD)) {
                inputElem.value = GUARD + inputElem.value.replace(new RegExp(GUARD, 'g'), '');
                return;
            }

            const raw = toFullWidth(inputElem.value.slice(GUARD.length));
            const target = currentTarget();

            // 完全一致 → 正解
            if (raw === target) {
                renderTarget(target, target.length);
                inputElem.disabled = true;
                proceedToNextStep();
                return;
            }

            // 途中の前方一致を調べる
            let i = 0;
            while (i < raw.length && i < target.length && raw[i] === target[i]) i++;

            if (i < raw.length) {
                // ミス
                state.misses++;
                uiMiss.innerText = state.misses;
                triggerShake();
                // 入力をリセット（打ち直し）
                inputElem.value = GUARD;
                state.typed = 0;
                renderTarget(target, 0);
            } else {
                // 途中正解（まだ打ち続けている）
                state.typed = i;
                renderTarget(target, i);
            }
        }

        // =============================================
        //  次のステップへ
        // =============================================
        function proceedToNextStep() {
            const data = currentCustomerData();
            const response = data.chatLog[state.phrase].customer;
            state.phrase++;

            customerSpeak(response, () => {
                if (state.phrase >= data.chatLog.length) {
                    // この客の対応完了
                    setTimeout(endCustomer, 1200);
                } else {
                    activateInput();
                    renderTarget(currentTarget(), 0);
                }
            });
        }

        // =============================================
        //  客が帰る
        // =============================================
        function endCustomer() {
            custImgElem.style.opacity = '0';
            staffImgElem.style.opacity = '0';
            setTimeout(() => {
                state.cust++;
                const dayData = GAME_DATA[state.day];
                if (state.cust >= dayData.customers.length) {
                    showDayResult();
                } else {
                    startCustomer();
                }
            }, 1200);
        }

        // =============================================
        //  日別リザルト
        // =============================================
        function showDayResult() {
            const isFinal = state.day === GAME_DATA.length - 1;

            document.getElementById('result-title').innerText =
                isFinal ? '🎉 祝・全日程クリア 🎉' : `${state.day + 1}日目 終了`;

            document.getElementById('result-miss').innerText = state.misses;
            nextBtn.innerText = isFinal ? 'タイトルへ戻る' : '次の日へ';

            const rankBlock = document.getElementById('rank-block');
            if (isFinal) {
                rankBlock.style.display = 'block';
                const rankImg = document.getElementById('rank-img');
                const rankText = document.getElementById('rank-text');

                if (state.misses === 0) {
                    rankImg.src = '../img/4/rank_perfect.png';
                    rankText.innerText = 'ランク：メイドオブメイド';
                    rankText.style.color = '#ffd700';
                } else if (state.misses <= 4) {
                    rankImg.src = '../img/4/rank_a.png';
                    rankText.innerText = 'ランク：一流メイド';
                    rankText.style.color = '#ffeb3b';
                } else if (state.misses <= 15) {
                    rankImg.src = '../img/4/rank_b.png';
                    rankText.innerText = 'ランク：見習い卒業';
                    rankText.style.color = '#ffffff';
                } else {
                    rankImg.src = '../img/4/rank_c.png';
                    rankText.innerText = 'ランク：ドジっ子メイド';
                    rankText.style.color = '#cfd8dc';
                }
            } else {
                rankBlock.style.display = 'none';
            }

            resultScreen.style.display = 'flex';
        }

        // =============================================
        //  ヘルパー
        // =============================================
        function currentCustomerData() {
            return GAME_DATA[state.day].customers[state.cust];
        }
        function currentTarget() {
            return currentCustomerData().chatLog[state.phrase].staff;
        }

        // =============================================
        //  イベントリスナー
        // =============================================
        startButton.addEventListener('click', () => {
            titleScreen.style.opacity = '0';
            setTimeout(() => {
                titleScreen.style.display = 'none';
                gameMain.style.display = 'flex';
                startCustomer();
            }, 500);
        });

        nextBtn.addEventListener('click', () => {
            resultScreen.style.display = 'none';
            if (state.day >= GAME_DATA.length - 1) {
                location.reload();
            } else {
                state.day++;
                state.cust = 0;
                startCustomer();
            }
        });

        // IME対応
        inputElem.addEventListener('compositionstart', () => { state.composing = true; });
        inputElem.addEventListener('compositionend', () => { state.composing = false; checkInput(); });
        inputElem.addEventListener('input', () => { if (!state.composing) checkInput(); });

        // Backspaceとカーソル移動のガード
        inputElem.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && inputElem.value.length <= GUARD.length) {
                e.preventDefault();
            }
            if (e.key === 'ArrowLeft' && inputElem.selectionStart <= GUARD.length) {
                e.preventDefault();
            }
        });

        // クリックでカーソルを末尾に固定
        inputElem.addEventListener('click', () => {
            inputElem.setSelectionRange(inputElem.value.length, inputElem.value.length);
        });

        // 起動時の設定
        window.addEventListener('load', () => {
            inputElem.setAttribute('autocomplete', 'off');
            inputElem.setAttribute('autocorrect', 'off');
            inputElem.setAttribute('autocapitalize', 'off');
            inputElem.setAttribute('spellcheck', 'false');
            // 自動フォーカス対策
            inputElem.readOnly = true;
            setTimeout(() => { inputElem.readOnly = false; }, 500);
        });
    </script>
</body>

</html>
